<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Ordinaryunus icon, pixel-hinted variant for 32 px: every edge sits on the pixel grid. -->
  <defs>
    <clipPath id="tile"><rect width="32" height="32" rx="7"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="32" height="32" fill="#0F766E"/>
    <path d="M2 32V31C2 29 5 28 8 28H24C27 28 30 29 30 31V32Z" fill="#FFFFFF"/>
    <rect x="12" y="24" width="8" height="5" fill="#F1C7A3"/>
    <rect x="6" y="6" width="20" height="20" rx="8" fill="#F1C7A3"/>
    <path d="M6 12V11C6 6.4 10.5 3.5 16 3.5C21.5 3.5 26 6.4 26 11V12H24V9L8 11V12Z" fill="#1F2937"/>
    <!-- glasses: solid frames, white lenses, bridge -->
    <g fill="#1F2937">
      <rect x="4" y="12" width="10" height="8" rx="1.5"/>
      <rect x="18" y="12" width="10" height="8" rx="1.5"/>
      <rect x="14" y="14" width="4" height="2"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="6" y="14" width="6" height="4" rx="0.5"/>
      <rect x="20" y="14" width="6" height="4" rx="0.5"/>
    </g>
    <g fill="#1F2937">
      <rect x="8" y="15" width="2" height="2" rx="0.5"/>
      <rect x="22" y="15" width="2" height="2" rx="0.5"/>
      <!-- smile: crescent, 2 px thick in the middle -->
      <path d="M12 21.5C12.5 23.7 14 25 16 25C18 25 19.5 23.7 20 21.5C18.6 22.6 17.3 23 16 23C14.7 23 13.4 22.6 12 21.5Z"/>
    </g>
  </g>
</svg>
