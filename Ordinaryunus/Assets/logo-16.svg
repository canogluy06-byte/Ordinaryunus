<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Ordinaryunus icon, pixel-hinted variant for 16 px. 1 unit = 1 px.
       Only hair, face and glasses survive at this size: no pupils or mouth (they turn into grey smudges). -->
  <defs>
    <clipPath id="tile"><rect width="16" height="16" rx="3.5"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- tile, shirt, neck, face -->
    <rect width="16" height="16" fill="#0F766E"/>
    <path d="M0 16V15C0 14.4 1.5 14 3 14H13C14.5 14 16 14.4 16 15V16Z" fill="#FFFFFF"/>
    <rect x="6" y="12" width="4" height="3" fill="#F1C7A3"/>
    <rect x="3" y="3" width="10" height="10" rx="4" fill="#F1C7A3"/>
    <!-- hair with diagonal side-swept fringe -->
    <path d="M3 6V5.5C3 3.3 5.2 2 8 2C10.8 2 13 3.3 13 5.5V6H12V4.5L4 5.5V6Z" fill="#1F2937"/>
    <!-- glasses: 1 px frames wider than the face, bridge, white lenses -->
    <g fill="#1F2937">
      <rect x="2" y="6" width="5" height="4" rx="0.5"/>
      <rect x="9" y="6" width="5" height="4" rx="0.5"/>
      <rect x="7" y="7" width="2" height="1"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="3" y="7" width="3" height="2"/>
      <rect x="10" y="7" width="3" height="2"/>
    </g>
  </g>
</svg>
