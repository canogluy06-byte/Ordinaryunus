<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Ordinaryunus icon, pixel-hinted variant for 24 px (small icon at 150% DPI).
       1 unit = 1 px; no halo or ears, head enlarged, glasses with white lenses. -->
  <defs>
    <clipPath id="tile"><rect width="24" height="24" rx="5.25"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <!-- tile, shirt, neck, face -->
    <rect width="24" height="24" fill="#0F766E"/>
    <path d="M1 24V23.5C1 22 3 21 6 21H18C21 21 23 22 23 23.5V24Z" fill="#FFFFFF"/>
    <rect x="10" y="18" width="4" height="4" fill="#F1C7A3"/>
    <rect x="5" y="4" width="14" height="15" rx="6" fill="#F1C7A3"/>
    <!-- hair with diagonal side-swept fringe -->
    <path d="M5 9V8C5 4.6 8.1 2.5 12 2.5C15.9 2.5 19 4.6 19 8V9H18V6.5L6 8.5V9Z" fill="#1F2937"/>
    <!-- glasses: 1 px frames, bridge, white lenses -->
    <g fill="#1F2937">
      <rect x="3" y="9" width="8" height="6" rx="1"/>
      <rect x="13" y="9" width="8" height="6" rx="1"/>
      <rect x="11" y="10" width="2" height="1"/>
    </g>
    <g fill="#FFFFFF">
      <rect x="4" y="10" width="6" height="4"/>
      <rect x="14" y="10" width="6" height="4"/>
    </g>
    <!-- pupils (2 x 2 px) and smile (pixel U shape, 6 x 2 px) -->
    <g fill="#1F2937">
      <rect x="6" y="11" width="2" height="2"/>
      <rect x="16" y="11" width="2" height="2"/>
      <path d="M9 16H10V17H14V16H15V17L14 18H10L9 17Z"/>
    </g>
  </g>
</svg>
