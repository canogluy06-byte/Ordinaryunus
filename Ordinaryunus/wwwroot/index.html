<div id="splash"><img class="splash-mark" src="img/logo-64.png" alt=""></div>

<div id="login" class="hidden">
  <div class="login-mesh"></div>
  <div class="login-card" id="login-card">
    <img class="logo" src="img/logo-256.png" alt="Ordinaryunus">
    <h1>Ordinaryunus</h1>
    <div class="tag">Senin ikinci beynin, tek ekranda.</div>
    <form class="login-form" id="login-form" autocomplete="off">
      <div class="login-field">
        <input type="password" id="login-pass" placeholder="Şifre" maxlength="128" autocomplete="new-password">
        <button type="button" class="eye" id="login-eye" aria-label="Şifreyi göster"><svg class="icon"><use href="#i-eye"/></svg></button>
      </div>
      <div class="login-field hidden" id="login-repeat-wrap">
        <input type="password" id="login-repeat" placeholder="Şifreyi tekrar yaz" maxlength="128" autocomplete="new-password">
      </div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="login-submit" id="login-submit">Giriş yap</button>
    </form>
    <button class="login-forgot" id="login-forgot">Şifremi unuttum</button>
  </div>
  <!-- Yapımcı imzası: metni login.js, imza.js'teki değerlerden doldurur. -->
  <div class="login-imza" id="login-imza"></div>
</div>
